name: Validate release version
description: Fail if the version is not MAJOR.MINOR.PATCH or if the tag v<version> already exists on origin.

inputs:
  version:
    description: Release version in MAJOR.MINOR.PATCH form (without the "v" prefix).
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::version must be MAJOR.MINOR.PATCH, got: $VERSION"
          exit 1
        fi

        set +e
        git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null
        status=$?
        set -e

        case "$status" in
          0)
            echo "::error::tag v$VERSION already exists"
            exit 1
            ;;
          2)
            echo "version $VERSION is valid and tag v$VERSION does not exist yet"
            ;;
          *)
            echo "::error::failed to query tags on origin (git ls-remote exit code $status); is the repository checked out?"
            exit 1
            ;;
        esac
